[project]
name = "osm2gridworld"
version = "0.1.0"
description = "Takes OSM maps and Lidar laz files and generates rasterized gridworld"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "laspy[lazrs]>=2.6.1",
    "matplotlib>=3.10.7",
    "numpy>=2.3.5",
    "osmnx>=2.0.7",
    "pyproj>=3.7.2",
    "rasterio>=1.4.3",
    "scipy>=1.17.0",
    "wget>=3.2",
]


